<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Clients</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        textarea {
            height: 80px;
            resize: vertical;
        }
        
        button {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .btn-danger {
            background-color: #e74c3c;
        }
        
        .btn-danger:hover {
            background-color: #c0392b;
        }
        
        .btn-success {
            background-color: #27ae60;
        }
        
        .btn-success:hover {
            background-color: #219a52;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #2c3e50;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .actions {
            white-space: nowrap;
        }
        
        .actions button {
            padding: 5px 10px;
            margin-right: 5px;
            font-size: 12px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: black;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestion des Clients</h1>
        
        <div class="section">
            <h2>Créer un nouveau client</h2>
            <form id="clientForm">
                <input type="hidden" id="idClient">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>
                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="telephone">Téléphone</label>
                        <input type="tel" id="telephone" name="telephone">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="adresse">Adresse</label>
                    <textarea id="adresse" name="adresse"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="dateNaissance">Date de naissance</label>
                        <input type="date" id="dateNaissance" name="dateNaissance">
                    </div>
                    <div class="form-group">
                        <label for="profession">Profession</label>
                        <input type="text" id="profession" name="profession">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="revenuMensuel">Revenu mensuel</label>
                        <input type="number" id="revenuMensuel" name="revenuMensuel" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="motdepasse">Mot de passe</label>
                        <input type="password" id="motdepasse" name="motdepasse" required>
                    </div>
                </div>
                
                <button type="button" onclick="ajouterOuModifier()" class="btn-success">Ajouter / Modifier</button>
                <button type="button" onclick="resetForm()">Réinitialiser</button>
            </form>
        </div>
        
        <div class="section">
            <h2>Liste des clients</h2>
            
            <table id="clientsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Profession</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="clientsTableBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Détails du client</h2>
            <div id="clientDetails"></div>
        </div>
    </div>
    
    <script>
        const apiBase = "http://localhost:80/finance/ws";

        function ajax(method, url, data, callback) {
            const xhr = new XMLHttpRequest();
            xhr.open(method, apiBase + url, true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr.onreadystatechange = () => {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            callback(JSON.parse(xhr.responseText));
                        } catch (e) {
                            // Affiche la réponse brute pour déboguer
                            alert("Réponse brute du serveur :\n" + xhr.responseText);
                            showAlert("Erreur de format de réponse du serveur.", "error");
                        }
                    } else {
                        showAlert("Erreur serveur : " + xhr.status, "error");
                    }
                }
            };
            xhr.send(data);
        }
        
        function chargerClients() {
            ajax("GET", "/clients", null, (data) => {
                const tbody = document.getElementById('clientsTableBody');
                tbody.innerHTML = '';
                const thead = document.querySelector('#clientsTable thead tr');
                thead.innerHTML = `
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Profession</th>
                    <th>Actions</th>
                `;
                
                data.forEach(client => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${client.idClient}</td>
                        <td>${client.nom}</td>
                        <td>${client.prenom}</td>
                        <td>${client.email}</td>
                        <td>${client.telephone || 'N/A'}</td>
                        <td>${client.profession || 'N/A'}</td>
                        <td class="actions">
                            <button onclick='remplirFormulaire(${JSON.stringify(client).replace(/'/g, "&#39;")})'>✏️</button>
                            <button onclick='viewClient(${client.idClient})' class="btn-success">👁️</button>
                            <button onclick='supprimerClient(${client.idClient})' class="btn-danger">🗑️</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }
        
        function chargerClientsDetails() {
            ajax("GET", "/clients/details", null, (data) => {
                const tbody = document.getElementById('clientsTableBody');
                tbody.innerHTML = '';
                
                const thead = document.querySelector('#clientsTable thead tr');
                thead.innerHTML = `
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>N° Compte</th>
                    <th>Solde</th>
                    <th>Date Création</th>
                    <th>Actions</th>
                `;
                
                data.forEach(client => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${client.idClient}</td>
                        <td>${client.nom}</td>
                        <td>${client.prenom}</td>
                        <td>${client.email}</td>
                        <td>${client.numeroCompte || 'N/A'}</td>
                        <td>${client.solde ? parseFloat(client.solde).toFixed(2) + ' €' : 'N/A'}</td>
                        <td>${client.dateCreation ? new Date(client.dateCreation).toLocaleDateString() : 'N/A'}</td>
                        <td class="actions">
                            <button onclick='viewClient(${client.idClient})' class="btn-success">👁️</button>
                            <button onclick='remplirFormulaire(${JSON.stringify(client).replace(/'/g, "&#39;")})'>✏️</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }
        
        function ajouterOuModifier() {
            const id = document.getElementById('idClient').value;
            const nom = document.getElementById('nom').value;
            const prenom = document.getElementById('prenom').value;
            const email = document.getElementById('email').value;
            const telephone = document.getElementById('telephone').value;
            const adresse = document.getElementById('adresse').value;
            const dateNaissance = document.getElementById('dateNaissance').value;
            const profession = document.getElementById('profession').value;
            const revenuMensuel = document.getElementById('revenuMensuel').value;
            const motdepasse = document.getElementById('motdepasse').value;
            
            // Encoder les données comme dans etudiant.html
            const data = `nom=${encodeURIComponent(nom)}&prenom=${encodeURIComponent(prenom)}&email=${encodeURIComponent(email)}&telephone=${encodeURIComponent(telephone)}&adresse=${encodeURIComponent(adresse)}&dateNaissance=${encodeURIComponent(dateNaissance)}&profession=${encodeURIComponent(profession)}&revenuMensuel=${encodeURIComponent(revenuMensuel)}&motdepasse=${encodeURIComponent(motdepasse)}`;
            
            if (id) {
                // Modification
                ajax("PUT", `/clients/${id}`, data, () => {
                    showAlert('Client modifié avec succès!', 'success');
                    resetForm();
                    chargerClients();
                });
            } else {
                // Ajout
                ajax("POST", "/clients", data, () => {
                    showAlert('Client créé avec succès!', 'success');
                    resetForm();
                    chargerClients();
                });
            }
        }
        
        function remplirFormulaire(client) {
            document.getElementById('idClient').value = client.idClient;
            document.getElementById('nom').value = client.nom;
            document.getElementById('prenom').value = client.prenom;
            document.getElementById('email').value = client.email;
            document.getElementById('telephone').value = client.telephone || '';
            document.getElementById('adresse').value = client.adresse || '';
            document.getElementById('dateNaissance').value = client.dateNaissance || '';
            document.getElementById('profession').value = client.profession || '';
            document.getElementById('revenuMensuel').value = client.revenuMensuel || '';
            document.getElementById('motdepasse').value = '';
        }
        
        function viewClient(id) {
            ajax("GET", `/clients/${id}`, null, (client) => {
                const detailsDiv = document.getElementById('clientDetails');
                detailsDiv.innerHTML = `
                    <p><strong>ID:</strong> ${client.idClient}</p>
                    <p><strong>Nom:</strong> ${client.nom}</p>
                    <p><strong>Prénom:</strong> ${client.prenom}</p>
                    <p><strong>Email:</strong> ${client.email}</p>
                    <p><strong>Téléphone:</strong> ${client.telephone || 'N/A'}</p>
                    <p><strong>Adresse:</strong> ${client.adresse || 'N/A'}</p>
                    <p><strong>Date de naissance:</strong> ${client.dateNaissance || 'N/A'}</p>
                    <p><strong>Profession:</strong> ${client.profession || 'N/A'}</p>
                    <p><strong>Revenu mensuel:</strong> ${client.revenuMensuel ? parseFloat(client.revenuMensuel).toFixed(2) + ' €' : 'N/A'}</p>
                    <p><strong>Date d'inscription:</strong> ${client.dateInscription ? new Date(client.dateInscription).toLocaleDateString() : 'N/A'}</p>
                `;
                document.getElementById('detailsModal').style.display = 'block';
            });
        }
        
        function supprimerClient(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer ce client?')) {
                ajax("DELETE", `/clients/${id}`, null, () => {
                    showAlert('Client supprimé avec succès!', 'success');
                    chargerClients();
                });
            }
        }
        
        function resetForm() {
            document.getElementById('idClient').value = '';
            document.getElementById('nom').value = '';
            document.getElementById('prenom').value = '';
            document.getElementById('email').value = '';
            document.getElementById('telephone').value = '';
            document.getElementById('adresse').value = '';
            document.getElementById('dateNaissance').value = '';
            document.getElementById('profession').value = '';
            document.getElementById('revenuMensuel').value = '';
            document.getElementById('motdepasse').value = '';
        }
        
        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('detailsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
        
        function showAlert(message, type) {
            const existingAlert = document.querySelector('.alert');
            if (existingAlert) {
                existingAlert.remove();
            }
            
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            const container = document.querySelector('.container');
            container.insertBefore(alert, container.firstChild);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
        
        // Charger les clients au démarrage
        chargerClients();
    </script>
</body>
</html>
